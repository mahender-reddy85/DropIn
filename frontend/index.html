<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DropIn - Modern File Transfer</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/dropin.jpg" type="image/jpg">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container"> 
    <header>
      <h1><i class="fas fa-paper-plane"></i> DropIn</h1>
      <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">
        <i class="fas fa-moon"></i>
      </button>
    </header>

    <div class="tabs">
      <button class="tab active" id="sendTab">
        <i class="fas fa-upload"></i> Send
      </button>
      <button class="tab" id="receiveTab">
        <i class="fas fa-download"></i> Receive
      </button>
    </div>

    <!-- Send Section -->
    <div class="tab-content" id="sendContent">
      <div class="upload-zone" id="dropArea">
        <div class="upload-icon">
          <i class="fas fa-cloud-upload-alt"></i>
        </div>
        <h3>Drop files here or <span class="browse-link">browse</span></h3>
        <p class="max-size-text">Maximum file size: 100MB</p>
        <input type="file" id="fileInput" multiple hidden accept="image/*,video/*,audio/*,.pdf,.zip,.doc,.docx,.txt" />
      </div>

      <div class="file-controls">
        <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
          <label style="color: #666; font-size: 0.9em;"><i class="fas fa-lock"></i> Optional Password:</label>
          <input type="password" id="uploadPassword" placeholder="Protect with password..." style="padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; flex-grow: 1;">
        </div>
        <div style="display: flex; gap: 10px; width: 100%;">
          <button id="clearBtn" class="btn clear-btn" style="flex:1;">
            <i class="fas fa-trash"></i> Clear All
          </button>
          <button id="generateCodeBtn" class="btn generate-btn" style="flex:1.2;" disabled>
            <i class="fas fa-key"></i> Generate Code
          </button>
        </div>
      </div>

      <div class="file-list-container">
        <ul id="fileList" class="file-list"></ul>

      </div>

      <div class="history-panel" id="historyPanel" style="display:none;">
        <h4>Recent Transfers</h4>
        <ul id="historyList" class="history-list"></ul>
      </div>
    </div>

    <!-- Receive Section -->
    <div class="tab-content" id="receiveContent" style="display:none;">
      <div class="receive-section">
        <div class="receive-input">
          <label for="receiveInput">Enter transfer code or paste link</label>
          <input type="text" id="receiveInput" placeholder="e.g., A1B2C3D4 or paste link" maxlength="100" />
        </div>
        
        <div class="receive-input" style="margin-top:10px;" id="receivePasswordContainer">
          <label for="receivePassword"><i class="fas fa-lock"></i> Password (if protected)</label>
          <input type="password" id="receivePassword" placeholder="Enter password to unlock" />
        </div>

        <div class="receive-controls">
          <button id="scanQrBtn" class="btn scan-btn">
            <i class="fas fa-qrcode"></i> Scan QR Code
          </button>
          <button id="receiveBtn" class="btn receive-btn">
            <i class="fas fa-download"></i> Download
          </button>
        </div>

        <div id="qrModal" class="modal" style="display:none;">
          <div class="modal-content">
            <span id="closeScannerBtn" class="close">&times;</span>
            <div id="qrReader" style="width: 100%; height: 250px;"></div>
          </div>
        </div>

        <div id="downloadPreview" class="download-preview" style="display:none;">
          <h4>Download Preview <span id="downloadStats" style="font-size: 0.8em; font-weight: normal; margin-left: 10px; color: #666;"></span></h4>
          <div class="download-controls" style="margin-bottom: 15px;">
            <button id="downloadAllBtn" class="btn download-all-btn" style="width: 100%;">
              <i class="fas fa-download"></i> Download All Files
            </button>
          </div>
          <div id="downloadFileList" class="download-file-list"></div>

        </div>
      </div>
    </div>

    <!-- Code Modal -->
    <div id="codeModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span id="closeCodeModal" class="close">&times;</span>
        <h3>Your Transfer Code</h3>
      <div class="code-qr-wrapper">
        <div id="codeDisplay" class="code-display"></div>
        <div id="qrCodeContainer" class="qr-code-container"></div>
      </div>
      
      <div class="modal-actions">
        <button id="copyLinkBtn" class="btn copy-btn">
          <i class="fas fa-copy"></i> Copy Link
        </button>
        <button id="shareBtn" class="btn share-btn">
          <i class="fas fa-share-alt"></i> Share
        </button>
        <button id="emailBtn" class="btn email-btn">
          <i class="fas fa-envelope"></i> Email
        </button>
      </div>
      
      <div class="modal-management" style="margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 20px;">
        <h4 style="margin-bottom: 12px; font-size: 0.9rem; color: var(--text-secondary);">Manage this Link</h4>
        <div style="display: flex; gap: 10px;">
          <button id="extendBtn" class="btn secondary-btn" style="flex: 1; font-size: 0.85rem;">
            <i class="fas fa-history"></i> Extend (+24h)
          </button>
          <button id="deleteBtn" class="btn danger-btn" style="flex: 1; font-size: 0.85rem;">
            <i class="fas fa-trash-alt"></i> Destroy Now
          </button>
        </div>
      </div>
      </div>
    </div>

    <!-- Settings Panel -->
    <div id="settingsPanel" class="settings-panel" style="display:none;">
      <h4>Settings</h4>
      <div class="setting-item">
        <label>Max File Size</label>
        <select id="maxFileSize">
          <option value="50">50MB</option>
          <option value="100" selected>100MB</option>
          <option value="500">500MB</option>
        </select>
      </div>
      <div class="setting-item">
        <label>Link Expiration</label>
        <select id="linkExpiration">
          <option value="1">1 hour</option>
          <option value="24" selected>24 hours</option>
          <option value="168">7 days</option>
        </select>
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="notifications" checked />
          Enable notifications
        </label>
      </div>
    </div>

    <!-- Drag & Drop Global Overlay -->
    <div id="dragDropOverlay" class="drag-drop-global-overlay">
      <div class="overlay-content">
        <i class="fas fa-cloud-upload-alt pulse"></i>
        <span>Drop files anywhere to start uploading</span>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
